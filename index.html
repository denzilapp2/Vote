<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🗳️ හොඳම කණ්ඩායම තෝරමු</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--b1:#dfe9ff;--b2:#f6e6ff;--card:#ffffffcc;--tx:#1c2433;--mu:#667085;--bd:#dde2ee;--pr:#4f46e5;--in:#fff}
@media (prefers-color-scheme:dark){:root{--b1:#0a1024;--b2:#26124a;--card:#1a2030cc;--tx:#e8ecf6;--mu:#9aa5bd;--bd:#2c3550;--pr:#818cf8;--in:#10141f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,var(--b1),var(--b2));background-attachment:fixed;color:var(--tx);font-family:"Noto Sans Sinhala","Iskoola Pota",system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:clamp(1.4rem,4vw,2rem);margin:0 0 14px;background:linear-gradient(90deg,#4263eb,#9c36b5,#e8590c);-webkit-background-clip:text;background-clip:text;color:transparent}
.panel{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 6px 24px #0000001a}
label{display:block;font-size:.85rem;color:var(--mu);margin:8px 0 4px}
input,textarea,select{width:100%;font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:9px 11px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--in);color:var(--tx);border-radius:10px;padding:9px 16px}
button.p{background:var(--pr);border-color:var(--pr);color:#fff;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.msg{color:#e03131;font-weight:600;margin-top:10px}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:760px){.grid{grid-template-columns:300px 1fr}}
#qr{background:#fff;padding:12px;border-radius:14px;display:inline-block;line-height:0}
.lk{word-break:break-all;font-size:.78rem;color:var(--mu);margin-top:8px}
.r{margin:10px 0}.rt{display:flex;justify-content:space-between;font-weight:700;margin-bottom:3px}
.rb{height:26px;background:var(--bd);border-radius:13px;overflow:hidden}
.rb i{display:block;height:100%;border-radius:13px;transition:width .6s}
.top .rt{font-size:1.1rem}.top .rb{outline:3px solid gold}
.vb{display:block;width:100%;margin:10px 0;padding:18px;font-size:1.2rem;font-weight:800;color:#fff;border:0;border-radius:16px;text-align:left}
.vb:disabled{opacity:.35}
.big{font-size:1.5rem;font-weight:800;text-align:center;padding:24px 8px}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<h1>🗳️ හොඳම කණ්ඩායම තෝරමු</h1>

<!-- ADMIN -->
<div id="admin">
 <div class="panel" id="setup">
  <label for="db">Firebase Realtime Database URL (එක් වරක් පමණක් ඇතුළත් කරන්න)</label>
  <input id="db" placeholder="https://your-project-default-rtdb.firebaseio.com">
  <label for="pu">මෙම පිටුවේ GitHub Pages ලිපිනය (QR එකට)</label>
  <input id="pu">
  <label for="ti">ක්‍රියාකාරකම / ඡන්ද විමසුමේ මාතෘකාව</label>
  <input id="ti" value="හොඳම කණ්ඩායම කුමක්ද?">
  <div class="row">
   <div><label for="gc">කණ්ඩායම් ගණන</label><input id="gc" type="number" min="2" max="20" value="6"></div>
  </div>
  <label for="gn">කණ්ඩායම් නම් (අවශ්‍ය නම් පමණි — එක පේළියකට එක නමක්)</label>
  <textarea id="gn" rows="3"></textarea>
  <div class="bar"><button class="p" id="start">ඡන්ද විමසුම ආරම්භ කරන්න</button></div>
  <div class="msg" id="am"></div>
 </div>
 <div class="grid hide" id="live">
  <div class="panel" style="text-align:center">
   <b>QR කේතය ස්කෑන් කර ඡන්දය දෙන්න 📱</b><br><br>
   <div id="qr"></div>
   <div class="lk" id="lk"></div>
   <div class="bar" style="justify-content:center"><button id="cl">සබැඳිය පිටපත් කරන්න</button></div>
  </div>
  <div class="panel">
   <div class="rt"><span id="lt"></span><span id="tot"></span></div>
   <div id="res"></div>
   <div class="bar"><button id="tg">ඡන්දය වසන්න 🔒</button><button id="rs">ප්‍රතිඵල මකන්න</button><button id="nw">නව විමසුමක්</button></div>
   <div class="msg" id="lm"></div>
  </div>
 </div>
</div>

<!-- VOTER -->
<div id="voter" class="hide">
 <div class="panel">
  <div id="vt" style="font-weight:800;font-size:1.2rem"></div>
  <div id="vbody"></div>
 </div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
var $=function(i){return document.getElementById(i)};
var Q=new URLSearchParams(location.search),DB="",PID="",META=null,timer=null;
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function api(p,m,b){return fetch(DB+p+".json",{method:m||"GET",body:b===undefined?undefined:JSON.stringify(b)}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
function col(i,n){return"hsl("+Math.round(i*360/n)+",65%,42%)"}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function vv(v,i){return v?(v[i]||0):0}

/* ---------- ADMIN ---------- */
function admin(){
 $("db").value=ls("gv_db")||"";
 $("pu").value=ls("gv_pu")||(location.protocol==="file:"?"":location.origin+location.pathname);
 $("start").onclick=startPoll;
 $("nw").onclick=function(){clearInterval(timer);$("live").classList.add("hide");$("setup").classList.remove("hide")};
 $("cl").onclick=function(){var t=$("lk").textContent;if(navigator.clipboard)navigator.clipboard.writeText(t);else prompt("පිටපත් කරන්න:",t)};
 $("tg").onclick=function(){api("/polls/"+PID+"/meta","PATCH",{open:!META.open}).then(poll).catch(fail)};
 $("rs").onclick=function(){if(confirm("සියලුම ඡන්ද මකන්නද?"))Promise.all([api("/polls/"+PID+"/votes","DELETE"),api("/polls/"+PID+"/voters","DELETE")]).then(poll).catch(fail)};
}
function fail(e){$("am").textContent=$("lm").textContent="⚠ Firebase වෙත සම්බන්ධ විය නොහැක. URL සහ Rules පරීක්ෂා කරන්න ("+e.message+")"}
function startPoll(){
 DB=$("db").value.trim().replace(/\/+$/,"");
 var pu=$("pu").value.trim();
 if(!/^https:\/\//.test(DB)){$("am").textContent="Firebase Database URL එක https:// සහිතව ඇතුළත් කරන්න";return}
 if(!/^https?:\/\//.test(pu)){$("am").textContent="GitHub Pages ලිපිනය ඇතුළත් කරන්න (QR එක වැඩ කිරීමට ඕන)";return}
 ls("gv_db",DB);ls("gv_pu",pu);
 var nm=$("gn").value.split("\n").map(function(s){return s.trim()}).filter(Boolean);
 if(nm.length<2){var k=Math.max(2,Math.min(20,parseInt($("gc").value)||2));nm=[];for(var i=0;i<k;i++)nm.push("කණ්ඩායම "+(i+1))}
 PID=Math.random().toString(36).slice(2,8);
 META={title:$("ti").value.trim()||"හොඳම කණ්ඩායම කුමක්ද?",groups:nm,open:true};
 api("/polls/"+PID+"/meta","PUT",META).then(function(){
  var link=pu.split("?")[0]+"?v="+PID+"&db="+encodeURIComponent(DB);
  $("lk").textContent=link;$("qr").innerHTML="";
  try{new QRCode($("qr"),{text:link,width:240,height:240,correctLevel:QRCode.CorrectLevel.M})}catch(e){$("qr").textContent="QR නොමැත — සබැඳිය භාවිතා කරන්න"}
  $("setup").classList.add("hide");$("live").classList.remove("hide");$("am").textContent="";
  poll();clearInterval(timer);timer=setInterval(poll,2500);
 }).catch(fail);
}
function poll(){
 api("/polls/"+PID).then(function(d){
  if(!d||!d.meta)return;META=d.meta;var g=META.groups,n=g.length,t=0,mx=0,vs=[];
  for(var i=0;i<n;i++){var c=vv(d.votes,i);vs.push(c);t+=c;if(c>mx)mx=c}
  $("lt").textContent=META.title;$("tot").textContent="මුළු ඡන්ද: "+t;
  $("tg").textContent=META.open?"ඡන්දය වසන්න 🔒":"ඡන්දය විවෘත කරන්න 🔓";
  $("res").innerHTML=g.map(function(nm,i){var w=t?Math.round(vs[i]*100/t):0;
   return'<div class="r'+(mx>0&&vs[i]===mx?" top":"")+'"><div class="rt"><span>'+(mx>0&&vs[i]===mx?"🏆 ":"")+esc(nm)+'</span><span>'+vs[i]+" ("+w+'%)</span></div><div class="rb"><i style="width:'+w+"%;background:"+col(i,n)+'"></i></div></div>'}).join("");
  $("lm").textContent=META.open?"":"🔒 ඡන්දය දැන් වසා ඇත";
 }).catch(fail);
}

/* ---------- VOTER ---------- */
function voter(){
 $("admin").classList.add("hide");$("voter").classList.remove("hide");
 var dev=ls("gv_dev");if(!dev){dev=Math.random().toString(36).slice(2)+Date.now().toString(36);ls("gv_dev",dev)}
 var B=$("vbody");
 B.innerHTML='<div class="big">⏳</div>';
 api("/polls/"+PID+"/meta").then(function(m){
  if(!m){B.innerHTML='<div class="big">විමසුම හමු නොවීය 😕</div>';return}
  $("vt").textContent=m.title;
  if(ls("gv_v_"+PID)){B.innerHTML='<div class="big">✅ ඔබ දැනටමත් ඡන්දය දී ඇත. ස්තූතියි!</div>';return}
  if(!m.open){B.innerHTML='<div class="big">🔒 ඡන්දය වසා ඇත</div>';return}
  var n=m.groups.length,own=-1;
  B.innerHTML='<label>ඔබේ කණ්ඩායම (තමන්ගේ කණ්ඩායමට ඡන්දය දිය නොහැක)</label><select id="own"><option value="-1">— කණ්ඩායම් සාමාජිකයෙක් නොවේ —</option>'+m.groups.map(function(g,i){return'<option value="'+i+'">'+esc(g)+"</option>"}).join("")+'</select><div id="bt" style="margin-top:12px"></div>';
  function draw(){$("bt").innerHTML=m.groups.map(function(g,i){return'<button class="vb" style="background:'+col(i,n)+'" data-i="'+i+'"'+(i===own?" disabled":"")+'>'+esc(g)+"</button>"}).join("")}
  $("own").onchange=function(){own=+this.value;draw()};draw();
  $("bt").onclick=function(e){var b=e.target.closest(".vb");if(!b||b.disabled)return;var i=+b.dataset.i;
   if(!confirm("“"+m.groups[i]+"” සඳහා ඡන්දය දෙන්නද?"))return;
   B.innerHTML='<div class="big">⏳</div>';
   api("/polls/"+PID+"/voters/"+dev).then(function(x){
    if(x!==null){ls("gv_v_"+PID,"1");B.innerHTML='<div class="big">✅ ඔබ දැනටමත් ඡන්දය දී ඇත.</div>';return}
    return api("/polls/"+PID+"/voters/"+dev,"PUT",i).then(function(){return api("/polls/"+PID+"/votes/"+i,"PUT",{".sv":{"increment":1}})}).then(function(){ls("gv_v_"+PID,"1");B.innerHTML='<div class="big">🎉 ඔබේ ඡන්දය සටහන් විය. ස්තූතියි!</div>'})
   }).catch(function(){B.innerHTML='<div class="big">⚠ දෝෂයකි. නැවත උත්සාහ කරන්න.</div>'})}
 }).catch(function(){B.innerHTML='<div class="big">⚠ සම්බන්ධ විය නොහැක</div>'});
}

if(Q.get("v")&&Q.get("db")){PID=Q.get("v");DB=Q.get("db").replace(/\/+$/,"");voter()}else admin();
</script>
</body>
</html>
