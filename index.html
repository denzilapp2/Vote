<!-- ===== කණ්ඩායම් QR tab (ඡන්ද modal එකට අලුත් tab එකක්) =====
     අවසාන </body> ටැගයට හරියටම පෙර, පවතින අන්තිම </script> ට පසුව paste කරන්න. -->
<style>
.gqtabs{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap}
.gqtabs button.on{background:linear-gradient(135deg,#6366f1,#ec4899);color:#fff;border:none}
#gqp{display:none;text-align:center}
#gqp select{max-width:420px;margin:8px auto;display:block}
#gqqr{background:#fff;padding:12px;border-radius:14px;display:inline-block;line-height:0;margin-top:10px}
#gqnm{font-family:var(--fd);font-size:1.5rem;font-weight:800;margin-top:10px}
</style>

<script>
(function() {
  var qp = new URLSearchParams(location.search);

  /* ---------- සිසු (QR) පැත්ත: ?grp= තිබේ නම් ඒ කණ්ඩායමේ නම් පමණක් පෙන්වයි ---------- */
  if (typeof PLV !== "undefined" && PLV && qp.get("grp") !== null) {
    var GRP = parseInt(qp.get("grp"), 10), MEM = null, body = $("plvbody");
    function apply() {
      if (!MEM) return;
      var btns = body.querySelectorAll("button[data-k]");
      if (!btns.length) return;
      var shown = 0;
      [].forEach.call(btns, function(b) {
        var x = MEM[b.dataset.k];
        if (x && +x.g !== GRP) b.style.display = "none"; else shown++;
      });
      if (!$("gqnote")) {
        var p = document.createElement("p");
        p.id = "gqnote";
        p.style.cssText = "font-weight:800;font-size:1.1rem;margin:4px 0";
        p.textContent = shown
          ? "🏷️ " + gname(GRP) + " කණ්ඩායම — ඔබේ නම තෝරන්න"
          : "⚠️ " + gname(GRP) + " කණ්ඩායමේ සිසුන් තවම ලියාපදිංචි වී නැත. ගුරුතුමාට කියන්න: 'කණ්ඩායම් QR' tab එක නැවත විවෘත කරන්න.";
        body.insertBefore(p, btns[0]);
      }
    }
    plApi(PLV.db, "/polls/" + PLV.id + "/members").then(function(m) { MEM = m || {}; apply(); }).catch(function() {});
    new MutationObserver(apply).observe(body, { childList: true });
  }

  /* ---------- ගුරු පැත්ත: tab එක ---------- */
  var box = document.querySelector("#plm .plb");
  if (!box) return;
  var set = $("plset"), live = $("pllive");

  var tabs = document.createElement("div");
  tabs.className = "gqtabs";
  tabs.innerHTML = '<button type="button" id="gqt1" class="on">🗳️ ඡන්දය</button>' +
                   '<button type="button" id="gqt2">🏷️ කණ්ඩායම් QR</button>';
  box.insertBefore(tabs, set);

  var pan = document.createElement("div");
  pan.id = "gqp";
  pan.innerHTML =
    '<p class="plmu">කණ්ඩායමක් තෝරන්න. එම QR කේතය ස්කෑන් කරන සිසුන්ට පෙනෙන්නේ ඒ කණ්ඩායමේ නම් පමණි. ඔවුන් නම තෝරා ඡන්දය දෙයි.</p>' +
    '<select id="gqsel"></select>' +
    '<div id="gqnm"></div>' +
    '<div id="gqqr"></div>' +
    '<div class="pllk" id="gqlk"></div>' +
    '<div class="plrow" style="justify-content:center">' +
      '<button type="button" id="gqprev">⬅️ කලින්</button>' +
      '<button type="button" id="gqnext">ඊළඟ ➡️</button>' +
      '<button type="button" id="gqcp">📋 සබැඳිය පිටපත් කරන්න</button>' +
    '</div>' +
    '<div id="gqmsg" style="margin-top:8px;font-weight:700"></div>';
  box.appendChild(pan);

  var saved = { s: "", l: "none" };

  function show(n) {
    $("gqt1").classList.toggle("on", n === 1);
    $("gqt2").classList.toggle("on", n === 2);
    if (n === 2) {
      saved.s = set.style.display; saved.l = live.style.display;
      set.style.display = "none"; live.style.display = "none";
      pan.style.display = "block";
      build();
    } else {
      if (pan.style.display === "block") {
        pan.style.display = "none";
        set.style.display = saved.s; live.style.display = saved.l;
      }
    }
  }
  $("gqt1").onclick = function() { show(1); };
  $("gqt2").onclick = function() { show(2); };

  function build() {
    var m = $("gqmsg"), sel = $("gqsel");
    if (!PL.id) {
      m.textContent = "මුලින් '🗳️ ඡන්දය' tab එකෙන් ඡන්ද විමසුම ආරම්භ කරන්න.";
      sel.innerHTML = ""; $("gqqr").innerHTML = ""; $("gqlk").textContent = ""; $("gqnm").textContent = "";
      return;
    }
    m.textContent = "⏳ සිසුන් යාවත්කාලීන කරමින්...";
    plApi(PL.db, "/polls/" + PL.id + "/members", "PUT", plMembers())
      .then(function() { m.textContent = "✔ සිසුන් " + Object.keys(plMembers()).length + " දෙනෙක් යාවත්කාලීන විය."; })
      .catch(function(e) { m.textContent = "⚠ Firebase සම්බන්ධ විය නොහැක (" + e.message + ")"; });
    var prev = sel.value, gs = (PL.meta && PL.meta.groups) || [], h = "";
    gs.forEach(function(g, i) { h += '<option value="' + i + '">' + esc(g) + '</option>'; });
    sel.innerHTML = h;
    if (prev !== "" && +prev < gs.length) sel.value = prev;
    draw();
  }

  function draw() {
    var g = parseInt($("gqsel").value, 10);
    if (isNaN(g)) return;
    var pu = ($("plpu").value || "").trim().split("?")[0];
    var link = pu + "?v=" + PL.id + "&db=" + encodeURIComponent(PL.db) + "&grp=" + g;
    $("gqnm").textContent = $("gqsel").options[$("gqsel").selectedIndex].text;
    $("gqnm").style.color = col(g);
    $("gqlk").textContent = link;
    $("gqqr").innerHTML = "";
    try { new QRCode($("gqqr"), { text: link, width: 260, height: 260, correctLevel: QRCode.CorrectLevel.M }); }
    catch (e) { $("gqqr").textContent = "QR නොමැත — සබැඳිය භාවිතා කරන්න"; }
  }

  $("gqsel").onchange = draw;
  $("gqprev").onclick = function() {
    var s = $("gqsel"); if (!s.options.length) return;
    s.selectedIndex = (s.selectedIndex - 1 + s.options.length) % s.options.length; draw();
  };
  $("gqnext").onclick = function() {
    var s = $("gqsel"); if (!s.options.length) return;
    s.selectedIndex = (s.selectedIndex + 1) % s.options.length; draw();
  };
  $("gqcp").onclick = function() {
    var t = $("gqlk").textContent; if (!t) return;
    var ta = document.createElement("textarea");
    ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); showToast("📋 සබැඳිය පිටපත් කළා ✔"); } catch (e) {}
    document.body.removeChild(ta);
  };

  // modal එක වසා/විවෘත කරද්දී tab 1 වෙත ආපසු
  $("plx").addEventListener("click", function() { show(1); });
})();
</script>
