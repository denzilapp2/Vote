<!-- ===== ක්‍රියාකාරකම් / ගොනු උඩුගත කිරීම (Google Drive සහාය සහිතව) =====
     ඔබේ ගොනුවේ අවසාන </body> ටැගයට හරියටම පෙර (පවතින </script> ට පසුව) දමන්න.
     කලින් අනුවාද දමා තිබුණා නම් ඒවා ඉවත් කරන්න. -->
<style>
.acm,.acu{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:12px}
.acm{z-index:72}.acu{z-index:95}
.acm.on,.acu.on{display:flex}
.acb{background:var(--card);color:var(--tx);border:1.5px solid var(--bd);border-radius:20px;padding:16px;width:100%;max-width:980px;max-height:94vh;overflow:auto;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.acu .acb{max-width:520px;background:var(--bg)}
.acg{margin:14px 0;padding:10px;border:2px solid var(--bd);border-radius:14px}
.acg h3{margin:0 0 8px;font-size:1.05rem}
.acgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.acit{background:var(--bg);border:1.5px solid var(--bd);border-radius:12px;overflow:hidden;font-size:.85rem}
.acth{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;cursor:zoom-in}
.acic{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;font-size:3rem;background:rgba(128,128,128,.14)}
.acit .i{padding:6px 8px;word-break:break-word}
.acit .r{display:flex;gap:6px;flex-wrap:wrap;padding:0 8px 8px}
.acit .r button{padding:4px 10px;font-size:.78rem;border-radius:999px}
#aclb{position:fixed;inset:0;background:#000e;z-index:99;display:none;align-items:center;justify-content:center;cursor:zoom-out}
#aclb.on{display:flex}
#aclb img{max-width:100vw;max-height:100vh;object-fit:contain}
.acfl{margin:6px 0;padding:6px 10px;border:1.5px solid var(--bd);border-radius:10px;font-size:.85rem;display:flex;justify-content:space-between;gap:8px;word-break:break-all}
.acgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.acgs input{flex:1;min-width:220px}
</style>

<div id="acm" class="acm noprint"><div class="acb">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
    <b style="font-size:1.2rem">📂 කණ්ඩායම් ක්‍රියාකාරකම් සහ ගොනු</b>
    <span><button type="button" id="acrf">🔄 නැවුම් කරන්න</button> <button type="button" id="acx">✖ වසන්න</button></span>
  </div>
  <div class="acgs">
    <input id="acgs" placeholder="Google Drive: Apps Script Web App URL (https://script.google.com/macros/s/.../exec)">
    <button type="button" class="p" id="acgsb">💾 සුරකින්න</button>
  </div>
  <p class="plmu" id="acgsm"></p>
  <div id="acbody" class="plmu">⏳</div>
</div></div>
<div id="aclb"><img alt=""></div>

<div id="acu" class="acu"><div class="acb">
  <b style="font-size:1.15rem">📂 ක්‍රියාකාරකම් / ගොනු උඩුගත කරන්න</b>
  <p class="plmu" id="acuG"></p>
  <label for="acuF">ගොනු (පින්තූර, PDF, Word, Excel, PowerPoint, වීඩියෝ, ZIP ආදී ඕනෑම එකක්)</label>
  <input id="acuF" type="file" multiple>
  <div id="acuL"></div>
  <p class="plmu" id="acuN"></p>
  <label for="acuC">විස්තරය (විකල්පයි)</label>
  <textarea id="acuC" rows="3" maxlength="300" placeholder="උදා: අපේ ව්‍යාපෘති වාර්තාව සහ ඡායාරූප..."></textarea>
  <div class="plrow">
    <button type="button" class="p" id="acuS">⬆️ උඩුගත කරන්න</button>
    <button type="button" id="acuX">වසන්න</button>
  </div>
  <div id="acuM" style="margin-top:8px;font-weight:700"></div>
</div></div>

<script>
(function() {
  var DEFAULT_GS = "https://script.google.com/macros/s/AKfycbxs_L3rHPAWhqxlg0KHwuAakhyY_5mX3CevFF9ICM1rwnd6QH20SbviZZrrKv9KojJ3/exec";
  var U = { db: "", id: "", k: null, m: null, gs: "" }, F = $("acuF"), MS = $("acuM");
  function maxB() { return (U.gs ? 20 : 3) * 1024 * 1024; }
  function ext(n) { var m = /\.([a-z0-9]+)$/i.exec(n || ""); return m ? m[1].toLowerCase() : ""; }
  function icon(n, ty) {
    var e = ext(n);
    if (/^image\//.test(ty)) return "🖼️";
    if (/^video\//.test(ty)) return "🎬";
    if (/^audio\//.test(ty)) return "🎵";
    if (e === "pdf") return "📕";
    if (/^(doc|docx|odt|rtf)$/.test(e)) return "📘";
    if (/^(xls|xlsx|csv|ods)$/.test(e)) return "📗";
    if (/^(ppt|pptx|odp)$/.test(e)) return "📙";
    if (/^(zip|rar|7z|gz)$/.test(e)) return "🗜️";
    if (/^(txt|md|json|html|js|py)$/.test(e)) return "📄";
    return "📎";
  }
  function sz(b) { return b > 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB"; }
  function readURL(file, cb, er) {
    var fr = new FileReader(); fr.onerror = er; fr.onload = function() { cb(fr.result); }; fr.readAsDataURL(file);
  }
  function shrink(url, max, q, cb, er) {
    var im = new Image(); im.onerror = er;
    im.onload = function() {
      var s = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement("canvas");
      c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      cb(c.toDataURL("image/jpeg", q));
    };
    im.src = url;
  }
  function dl(dataUrl, name) {
    fetch(dataUrl).then(function(r) { return r.blob(); }).then(function(b) {
      var a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = name || "file"; a.click();
    });
  }

  // ---------- සිසු (QR) පැත්ත ----------
  F.onchange = function() {
    $("acuL").innerHTML = [].map.call(F.files, function(f) {
      var big = f.size > maxB() && !/^image\//.test(f.type);
      return '<div class="acfl"><span>' + icon(f.name, f.type) + " " + esc(f.name) + '</span><span>' + sz(f.size) + (big ? " ⚠ විශාල වැඩියි" : "") + '</span></div>';
    }).join("");
  };
  $("acuX").onclick = function() { $("acu").classList.remove("on"); };

  function sendOne(f, t) {
    return new Promise(function(res, rej) {
      var isImg = /^image\//.test(f.type) && !/svg|gif/.test(f.type);
      if (!isImg && f.size > maxB()) return rej(new Error(f.name + " : " + sz(maxB()) + " ට වඩා විශාලයි"));
      var base = { g: U.m.g, n: U.m.n, k: U.k, t: t, fn: f.name, ty: f.type || "", sz: f.size, ts: Date.now() };
      readURL(f, function(url) {
        function save(full, th) {
          if (U.gs) {
            var name = isImg && !/\.jpe?g$/i.test(f.name) ? f.name.replace(/\.[^.]+$/, "") + ".jpg" : f.name;
            fetch(U.gs, { method: "POST", body: JSON.stringify({
              name: name, type: isImg ? "image/jpeg" : f.type, data: full.split(",")[1],
              folder: "කණ්ඩායම " + (U.m.g + 1)
            }) }).then(function(r) { return r.json(); }).then(function(r) {
              if (!r.ok) throw new Error(r.error || "Drive දෝෂයකි");
              base.th = th || ""; base.u = r.url; base.did = r.id;
              return plApi(U.db, "/polls/" + U.id + "/acts", "POST", base);
            }).then(res).catch(function(e) { rej(new Error(f.name + " : " + e.message)); });
          } else {
            if (full.length > 4.4 * 1024 * 1024) return rej(new Error(f.name + " : විශාල වැඩියි"));
            plApi(U.db, "/polls/" + U.id + "/files", "POST", { d: full }).then(function(r) {
              base.th = th || ""; base.f = r.name;
              return plApi(U.db, "/polls/" + U.id + "/acts", "POST", base);
            }).then(res).catch(rej);
          }
        }
        if (isImg) shrink(url, U.gs ? 1600 : 1000, 0.75, function(full) {
          shrink(url, 240, 0.6, function(th) { save(full, th); }, rej);
        }, rej);
        else save(url, "");
      }, function() { rej(new Error(f.name + " : කියවිය නොහැක")); });
    });
  }

  $("acuS").onclick = function() {
    var fs = [].slice.call(F.files), t = $("acuC").value.trim(), i = 0;
    if (!fs.length && !t) { MS.textContent = "ගොනුවක් හෝ විස්තරයක් ඇතුළත් කරන්න."; return; }
    $("acuS").disabled = true;
    function done() {
      MS.textContent = "🎉 සාර්ථකව උඩුගත විය!";
      F.value = ""; $("acuL").innerHTML = ""; $("acuC").value = ""; $("acuS").disabled = false;
    }
    function fail(e) { MS.textContent = "⚠ " + e.message; $("acuS").disabled = false; }
    (function next() {
      if (i >= fs.length) {
        if (fs.length) return done();
        return plApi(U.db, "/polls/" + U.id + "/acts", "POST", { g: U.m.g, n: U.m.n, k: U.k, t: t, ts: Date.now() }).then(done).catch(fail);
      }
      MS.textContent = "⏳ උඩුගත වෙමින්... (" + (i + 1) + "/" + fs.length + ")";
      sendOne(fs[i], t).then(function() { i++; next(); }).catch(fail);
    })();
  };

  if (typeof PLV !== "undefined" && PLV) {
    U.db = PLV.db; U.id = PLV.id;
    var body = $("plvbody");
    body.addEventListener("click", function(e) {
      var b = e.target.closest("button");
      if (b && b.dataset && b.dataset.k) U.k = b.dataset.k;
    }, true);
    new MutationObserver(function() {
      if (!body.querySelector("[data-back]") || body.querySelector("#acOpen")) return;
      var b = document.createElement("button");
      b.type = "button"; b.id = "acOpen"; b.className = "plbtn";
      b.style.background = "linear-gradient(135deg,#f59e0b,#ef4444)";
      b.textContent = "📂 අපේ කණ්ඩායමේ ක්‍රියාකාරකම් / ගොනු උඩුගත කරන්න";
      b.onclick = function(ev) {
        ev.stopPropagation();
        if (!U.k) return;
        MS.textContent = "⏳"; $("acu").classList.add("on");
        Promise.all([
          plApi(U.db, "/polls/" + U.id + "/members/" + U.k),
          plApi(U.db, "/polls/" + U.id + "/meta/gs")
        ]).then(function(r) {
          U.m = r[0]; U.gs = r[1] || DEFAULT_GS;
          $("acuG").textContent = U.m.n + " • කණ්ඩායම " + (U.m.g + 1);
          $("acuN").textContent = "එක් ගොනුවකට උපරිම " + (U.gs ? "20" : "3") + " MB" + (U.gs ? " (Google Drive වෙත සුරැකේ)." : ".") + " පින්තූර ස්වයංක්‍රීයව කුඩා කෙරේ.";
          MS.textContent = "";
        }).catch(function() { MS.textContent = "⚠ සම්බන්ධ විය නොහැක."; });
      };
      body.insertBefore(b, body.querySelector("[data-back]"));
    }).observe(body, { childList: true });
  }

  // ---------- ගුරු පැත්ත: ගැලරිය ----------
  var tm = null, ACTS = {};
  function pushGs(v) {
    if (PL.id) return plApi(PL.db, "/polls/" + PL.id + "/meta", "PATCH", { gs: v });
    return Promise.resolve();
  }
  function load() {
    if (!PL.id) return;
    plApi(PL.db, "/polls/" + PL.id + "/acts").then(function(acts) {
      acts = ACTS = acts || {};
      var by = {}, h = "", tot = Object.keys(acts).length, gs = (PL.meta && PL.meta.groups) || [], n = gs.length || K;
      Object.keys(acts).forEach(function(k) { var a = acts[k]; (by[a.g] = by[a.g] || []).push(k); });
      for (var g = 0; g < n; g++) {
        var L = (by[g] || []).sort(function(x, y) { return acts[y].ts - acts[x].ts; });
        h += '<div class="acg" style="border-color:' + col(g) + '"><h3 style="color:' + col(g) + '">🏆 ' +
          esc(gs[g] || "කණ්ඩායම " + (g + 1)) + ' <span class="badge" style="font-size:.8rem">' + L.length + '</span></h3>';
        if (!L.length) h += '<div class="plmu">තවම උඩුගත කර නැත.</div>';
        else h += '<div class="acgrid">' + L.map(function(k) {
          var a = acts[k], has = a.f || a.u;
          return '<div class="acit">' +
            (a.th ? '<img class="acth" src="' + a.th + '" data-view="' + k + '" alt="">'
                  : '<div class="acic">' + (has ? icon(a.fn, a.ty) : "💬") + '</div>') +
            '<div class="i"><b>' + esc(a.n || "") + '</b>' +
            (a.fn ? '<br>' + esc(a.fn) + ' · ' + sz(a.sz || 0) : '') +
            (a.t ? '<br>' + esc(a.t) : '') + '</div>' +
            '<div class="r">' +
            (a.u ? '<button type="button" data-open="' + k + '">📁 Drive හි බලන්න</button>' :
             a.f ? '<button type="button" data-dl="' + k + '">⬇️ බාගත</button>' : '') +
            '<button type="button" data-del="' + k + '">🗑️</button></div></div>';
        }).join("") + '</div>';
        h += '</div>';
      }
      $("acbody").className = "";
      $("acbody").innerHTML = '<p class="plmu">මුළු ඇතුළත් කිරීම්: ' + tot + '</p>' + h;
    }).catch(function(e) { $("acbody").textContent = "⚠ පූරණය කළ නොහැක (" + e.message + ")"; });
  }

  $("acbody").addEventListener("click", function(e) {
    var v = e.target.closest("[data-view]"), d = e.target.closest("[data-dl]"),
        o = e.target.closest("[data-open]"), x = e.target.closest("[data-del]");
    if (o) { window.open(ACTS[o.dataset.open].u, "_blank"); }
    else if (v) {
      var a = ACTS[v.dataset.view];
      if (a.u) { window.open(a.u, "_blank"); return; }
      showToast("⏳ පූරණය වෙමින්...");
      plApi(PL.db, "/polls/" + PL.id + "/files/" + a.f).then(function(r) {
        $("aclb").querySelector("img").src = r.d; $("aclb").classList.add("on");
      }).catch(plFail);
    } else if (d) {
      var b = ACTS[d.dataset.dl]; showToast("⏳ බාගත වෙමින්...");
      plApi(PL.db, "/polls/" + PL.id + "/files/" + b.f).then(function(r) { dl(r.d, b.fn); }).catch(plFail);
    } else if (x && confirm("මෙය මකන්නද? (Drive ගොනුව ඔබේ Trash වෙත යයි)")) {
      var c = ACTS[x.dataset.del], gsu = lsg("ac_gs") || DEFAULT_GS, ps = [plApi(PL.db, "/polls/" + PL.id + "/acts/" + x.dataset.del, "DELETE")];
      if (c.f) ps.push(plApi(PL.db, "/polls/" + PL.id + "/files/" + c.f, "DELETE"));
      if (c.did && gsu) ps.push(fetch(gsu, { method: "POST", body: JSON.stringify({ action: "trash", id: c.did }) }).catch(function() {}));
      Promise.all(ps).then(load).catch(plFail);
    }
  });
  $("aclb").onclick = function() { $("aclb").classList.remove("on"); };

  $("acgsb").onclick = function() {
    var v = $("acgs").value.trim();
    if (v && !/^https:\/\/script\.google\.com\/.+\/exec/.test(v)) { $("acgsm").textContent = "⚠ URL එක https://script.google.com/.../exec ආකාරයෙන් තිබිය යුතුයි."; return; }
    lsg("ac_gs", v);
    pushGs(v).then(function() {
      $("acgsm").textContent = v ? "✔ Google Drive සක්‍රියයි — සිසුන්ගේ ගොනු Drive වෙත සුරැකේ." : "Drive අක්‍රියයි — ගොනු Firebase හි සුරැකේ (3 MB සීමාව).";
    }).catch(plFail);
  };

  var tools = document.querySelector(".tools");
  if (tools) {
    var ab = document.createElement("button");
    ab.type = "button"; ab.className = "wheel-btn"; ab.id = "actBtn";
    ab.textContent = "📂 ක්‍රියාකාරකම්";
    tools.insertBefore(ab, $("soundBtn"));
    ab.onclick = function() {
      if (!PL.id) { showToast("මුලින් '🗳️ ඡන්ද විමසුම' ආරම්භ කර QR කේතය සිසුන්ට බෙදන්න."); return; }
      var v = lsg("ac_gs") || DEFAULT_GS;
      $("acgs").value = v;
      if (v) pushGs(v).catch(function() {});
      $("acgsm").textContent = v ? "✔ Google Drive සක්‍රියයි." : "Drive URL නොමැති නම් ගොනු Firebase හි සුරැකේ (3 MB සීමාව).";
      $("acm").classList.add("on"); load();
      clearInterval(tm); tm = setInterval(load, 8000);
    };
    $("acx").onclick = function() { $("acm").classList.remove("on"); clearInterval(tm); };
    $("acrf").onclick = load;
  }
